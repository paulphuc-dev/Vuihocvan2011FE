<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Trang đọc sách</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/page.css"/>
    </head>
    <body>

        <div class="container px-0">
            <div class="reader-container shadow-sm rounded">
            
                <!-- Header -->
                <h4 class="text-center text-muted mb-1"></h4>
                <h1 class="text-center mb-4"></h1>

                <!-- Audio -->
                <div id="audio" class="d-flex align-items-center gap-2 mb-3">
                    <button class="btn btn-light play-btn">▶</button>
                    <div class="progress flex-grow-1" style="height:6px;">
                        <div class="progress-bar"></div>
                    </div>
                    <small class="audio-time">0:00 / 0:00</small>
                </div>

                <!-- Image -->
                <div class="text-center my-4">
                    <img class="img-fluid rounded" style="max-width:550px;">
                </div>

                <!-- Content -->
                <div class="content mb-4">
                    <p></p>
                </div>

                <!-- Chat -->
                <div class="chat-box p-3">
                    <div id="messages">
                        
                    </div>
                </div>
                <div class="d-flex gap-2 mt-2">
                    <input id="input" class="form-control rounded-pill">
                    <button id="send" class="btn btn-warning rounded-pill">Hỏi</button>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button class="next-btn">
                Làm bài tập
            </button>
        </div>
        <script src="js/detail.js"></script>
    </body>
</html>
