<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trắc nghiệm</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/test.css"/>
</head>

<body>
    <div class="container container-box p-4 shadow-sm rounded">
        <p class="text-center text-muted mb-1"></p>
        <h4 class="text-center mb-4">Phần 2: Câu hỏi trắc nghiệm</h4>

        <!-- FORM -->
        <form id="quizForm" action="#" method="POST">

            <!-- Câu 1 -->
            <div class="question-box">
                <h5></h5>

                <label class="option">
                    <input type="radio" name="q1" value="A"> 
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="B"> 
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="C"> 
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="D"> 
                </label>
            </div>

            <!-- Submit -->
            <div class="text-center">
                <button type="submit" class="btn submit-btn">Nộp bài</button>
            </div>
        </form>

        <div id="resultOverlay" class="overlay hidden">
            <div class="popup">
                <h4>Kết quả bài làm</h4>

                <div class="charts">
                    <div class="chart-container">
                        <canvas id="scoreChart"></canvas>
                        <div class="chart-center" id="scoreText">0%</div>
                    </div>

                    <div class="stats">
                        <p>✔ Đúng: <span id="correct"></span></p>
                        <p>❌ Sai: <span id="wrong"></span></p>
                        <p>📋 Tổng: <span id="total"></span></p>
                    </div>
                </div>

                <div id="detail"></div>

                <button onclick="closePopup()" class="btn btn-secondary mt-3">Đóng</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/test.js"></script>
</body>
</html>
